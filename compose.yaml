services:
  lgtm:
    image: docker.io/grafana/otel-lgtm:latest
    container_name: lgtm-stack
    restart: unless-stopped
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
      - "${OTLP_GRPC_PORT:-4317}:4317"
      - "${OTLP_HTTP_PORT:-4318}:4318"
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ${LGTM_DATA_PATH:-lgtm-data}:/data:Z
    environment:
      ENABLE_LOGS_ALL: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl -fsS http://localhost:3000/api/health >/dev/null &&
          curl -fsS http://localhost:3100/ready >/dev/null &&
          curl -fsS http://localhost:9090/-/ready >/dev/null
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 12

  alloy:
    image: docker.io/grafana/alloy:latest
    restart: unless-stopped
    depends_on:
      lgtm:
        condition: service_healthy
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    ports:
      - "${SYSLOG_PORT:-1514}:1514/tcp"
      - "${SYSLOG_PORT:-1514}:1514/udp"
      - "${SYSLOG_RFC5424_PORT:-1515}:1515/tcp"
      - "${SYSLOG_RFC5424_PORT:-1515}:1515/udp"
      - "127.0.0.1:${ALLOY_PORT:-12345}:12345"
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro,Z
      - alloy-data:/var/lib/alloy/data

volumes:
  lgtm-data:
  alloy-data:
